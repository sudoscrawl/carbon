[project]
name = "carbon"
version = "0.1.03"
description = "Handle your server effortlessly."
readme = "README.md"
authors = [
    { name = "Ayush Kumar", email = "ayush438500@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "discord-py>=2.7.1",
    "pendulum>=3.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "polib>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

